<style>
:root{
  --bg:#140f33; --bg2:#1d1650; --card:#221a5c; --card2:#2d2375; --line:#43369a;
  --txt:#f7f4ff; --mut:#b4abee;
  --coin:#ffc933; --hot:#ff5a7a; --mint:#3df0b0; --sky:#58c8ff; --violet:#a266ff; --flame:#ff8a3d;
  --display:'Bungee','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);
  background-image:radial-gradient(900px 500px at 85% -10%,#5b2ea866,transparent 60%),radial-gradient(700px 500px at -10% 30%,#ff5a7a2e,transparent 60%);
  background-attachment:fixed;
  color:var(--txt);font-family:var(--body);font-weight:700;min-height:100vh;min-height:100dvh;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:var(--txt)}
h1,h2,h3{margin:0;font-family:var(--display);font-weight:400;letter-spacing:.2px}
.wrap{max-width:520px;margin:0 auto;padding:14px 14px calc(104px + env(safe-area-inset-bottom))}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:#140f33dd;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.topin{max-width:520px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.av{width:46px;height:46px;border-radius:16px;background:linear-gradient(140deg,var(--violet),var(--hot));display:grid;place-items:center;font-size:26px;flex:none;box-shadow:0 3px 0 #0006}
.who{flex:1;min-width:0}
.nm{font-family:var(--display);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mut);margin-top:1px}
.xpbar{height:9px;background:#0007;border-radius:99px;overflow:hidden;margin-top:5px}
.xpfill{height:100%;background:linear-gradient(90deg,var(--sky),var(--mint));border-radius:99px;transition:width 1s cubic-bezier(.2,.9,.3,1)}
.pill{background:#ffffff1a;border-radius:99px;padding:7px 11px;font-size:15px;white-space:nowrap}
.pill.fire{color:var(--coin)}

/* cards */
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:2px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px;position:relative}
.card h3{font-size:15px;margin-bottom:10px}
.lab{font-size:13px;color:var(--mut)}
.big{font-family:var(--display);font-size:30px;line-height:1.1}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mint{color:var(--mint)}.coin{color:var(--coin)}.hot{color:var(--hot)}.sky{color:var(--sky)}

.bar{height:14px;background:#0008;border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sky));transition:width .9s cubic-bezier(.2,.9,.3,1)}
.bar.gold>i{background:linear-gradient(90deg,var(--coin),var(--flame))}

/* boss chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:9px 13px;border-radius:99px;background:var(--card);border:2px solid var(--line);font-size:14px;max-width:190px}
.chip span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip.sel{border-color:var(--coin);background:var(--card2);box-shadow:0 0 0 3px #ffc93333}
.chip.add{border-style:dashed;color:var(--mut)}
.chip.dead{opacity:.55}

/* boss */
.edit{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:12px;background:#ffffff17;font-size:17px}
.stage{position:relative;display:grid;place-items:center;padding:12px 0 4px;min-height:150px}
.stage:before{content:"";position:absolute;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle,#ff5a7a55,transparent 68%);top:50%;left:50%;transform:translate(-50%,-50%)}
.boss{position:relative;font-size:112px;line-height:1;filter:drop-shadow(0 10px 18px #0009);animation:bob 3.2s ease-in-out infinite;user-select:none}
.boss.p3{animation-duration:1.6s}
.boss.p4{animation:jitter .35s linear infinite;filter:drop-shadow(0 10px 18px #0009) saturate(.7)}
.boss.dead{animation:none;filter:grayscale(1) drop-shadow(0 6px 10px #000a);opacity:.8}
.boss.shake{animation:shake .55s}
@keyframes bob{50%{transform:translateY(-9px) rotate(-3deg)}}
@keyframes jitter{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px) rotate(-1deg)}50%{transform:translate(2px,-1px)}75%{transform:translate(-1px,-2px) rotate(1deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}15%{transform:translateX(-20px) rotate(-10deg) scale(.92)}35%{transform:translateX(16px) rotate(8deg)}55%{transform:translateX(-11px) rotate(-4deg)}75%{transform:translateX(7px)}}
.dmg{position:absolute;top:22%;left:50%;font-family:var(--display);font-size:34px;color:var(--coin);text-shadow:0 3px 0 #a3002c,0 0 22px #ff5a7a;animation:rise 1.3s forwards;pointer-events:none;white-space:nowrap;z-index:5}
.dmg.crit{font-size:46px;color:#fff;text-shadow:0 3px 0 #ff5a7a,0 0 26px #ffc933}
@keyframes rise{0%{opacity:0;transform:translate(-50%,24px) scale(.4)}15%{opacity:1;transform:translate(-50%,0) scale(1.35)}100%{opacity:0;transform:translate(-50%,-100px) scale(1)}}
.bname{text-align:center;font-family:var(--display);font-size:20px;margin:4px 0 2px}
.taunt{text-align:center;color:var(--mut);font-size:14px;min-height:20px;margin-bottom:12px}
.hp{height:30px;background:#000b;border-radius:99px;border:3px solid #000;overflow:hidden;position:relative}
.hpfill{height:100%;background:linear-gradient(90deg,#ff2f5a,var(--flame));border-radius:99px;transition:width 1.1s cubic-bezier(.2,.9,.3,1);box-shadow:inset 0 -6px 0 #0003}
.hptxt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:13px;text-shadow:0 2px 3px #000}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.tri div{background:#0004;border-radius:14px;padding:9px 6px;text-align:center}
.tri b{display:block;font-family:var(--display);font-size:15px;font-weight:400;margin-top:3px}
.regen{margin-top:10px;font-size:13px;color:var(--hot);text-align:center}

.attack{display:block;width:100%;padding:18px;border-radius:22px;font-family:var(--display);font-size:26px;color:#2b0016;background:linear-gradient(180deg,#ffe066,var(--coin) 55%,var(--flame));box-shadow:0 6px 0 #a3480f,0 12px 26px #ff8a3d55;margin-bottom:16px;animation:pulse 2s ease-in-out infinite;transition:transform .08s}
.attack:active{transform:translateY(5px);box-shadow:0 1px 0 #a3480f}
@keyframes pulse{50%{box-shadow:0 6px 0 #a3480f,0 12px 38px #ffc933aa}}

.quest .row b{font-family:var(--display);font-weight:400;font-size:14px}
.done{color:var(--mint)}
.log{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #ffffff14}
.log:first-of-type{border-top:0}
.log .e{font-size:26px}
.log .m{flex:1;min-width:0}
.log .m small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.log .a{font-family:var(--display);font-size:15px;color:var(--coin)}
.log .x{font-size:12px;color:var(--sky);text-align:right}
.mini{width:34px;height:34px;border-radius:10px;background:#ffffff14;font-size:15px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#140f33f2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 8px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:14px;font-size:12px;color:var(--mut)}
nav button .i{font-size:24px;filter:grayscale(.7);transition:transform .15s}
nav button.on{color:var(--coin)}
nav button.on .i{filter:none;transform:translateY(-3px) scale(1.15)}

/* forms */
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
input[type=text],input[type=date],input[type=email],input[type=password]{width:100%;background:#0006;border:2px solid var(--line);border-radius:14px;padding:13px 14px;font-size:17px;outline:none}
input:focus{border-color:var(--sky)}
textarea{width:100%;min-height:150px;background:#0006;border:2px solid var(--line);border-radius:14px;padding:12px;color:var(--txt);font:600 13px/1.4 ui-monospace,Menlo,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;align-items:center;gap:10px;color:var(--txt);font-size:14px;margin-top:14px}
.chk input{width:22px;height:22px;accent-color:var(--mint)}
.pick{display:flex;flex-wrap:wrap;gap:8px}
.pk{width:52px;height:52px;border-radius:16px;background:#0005;border:2px solid var(--line);font-size:28px}
.pk.sel{border-color:var(--coin);background:var(--card2);box-shadow:0 0 0 3px #ffc93344}
.btn{display:block;width:100%;padding:15px;border-radius:16px;font-family:var(--display);font-size:17px;text-align:center;background:linear-gradient(180deg,var(--violet),#7a3df0);box-shadow:0 5px 0 #3d1b99;margin-top:16px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3d1b99}
.btn.gold{color:#2b0016;background:linear-gradient(180deg,#ffe066,var(--coin) 60%,var(--flame));box-shadow:0 5px 0 #a3480f}
.btn.gold:active{box-shadow:0 1px 0 #a3480f}
.btn.ghost{background:#ffffff14;box-shadow:none;font-family:var(--body);font-size:15px}
.btn.danger{background:#ff2f5a33;box-shadow:none;color:#ff9db0;font-family:var(--body);font-size:15px}
.qrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.q{padding:10px 14px;border-radius:99px;background:#ffffff1a;font-size:15px;border:2px solid transparent}
.q:active{transform:scale(.94)}
.q.fin{background:#ff5a7a33;color:#ffb0c0}

(()=>{
'use strict';

/* ---------- helpers ---------- */

 ["Ha! You'll be paying me forever.","Is that all you've got?","I'm not going anywhere."],

 ["I'm sweating... are you serious?","Please, have mercy!","You're getting scary good."],
 ["NO! Not like this!","I'm melting... MELTING!","Just one more hit and I'm done..."]

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const num=s=>{const v=parseFloat(String(s==null?'':s).replace(/[^0-9.]/g,''));return isFinite(v)?v:0};
const money=n=>'$'+(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

const dayNum=s=>{const [y,m,d]=s.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/864e5)};
const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
const lvl=xp=>Math.floor(Math.sqrt(xp/60))+1;
const lvlStart=L=>60*(L-1)*(L-1);
const title=L=>TITLES[Math.min(TITLES.length-1,Math.floor((L-1)/2))];
const pctXP=xp=>{const L=lvl(xp);return Math.max(0,Math.min(100,(xp-lvlStart(L))/(lvlStart(L+1)-lvlStart(L))*100))};
const fmtDate=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('en-US',{month:'short',day:'numeric'})};
const dur=m=>{const y=Math.floor(m/12),mo=m%12;return (y?y+(y>1?' yrs':' yr')+(mo?' ':''):'')+(mo||!y?mo+(mo===1?' mo':' mos'):'')};
const when=m=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+m);return d.toLocaleDateString('en-US',{month:'short',year:'numeric'})};

/* ---------- state ---------- */
let S=null,tab='battle',anim=null,planExtra=0,formBoss=BOSSES[0],formAv=AVATARS[0];
let sb=null;
let authMode='in',inviteCode='';
const TM={user:null,party:null,heroes:[],bosses:[],badges:[],feed:[],grave:[],loaded:false,loading:false,err:'',ch:null};
try{S=JSON.parse(localStorage.getItem(KEY))||null}catch(e){S=null}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(sb&&TM.user)syncSoon()};
const cur=()=>S.loans.find(l=>l.id===S.sel)||S.loans.find(l=>!l.slain)||S.loans[0];
const hp=l=>l.slain?0:Math.max(0,Math.min(1,l.balance/Math.max(1,l.original+(l.interest||0))));

/* ---------- interest regen ---------- */
function accrue(){
  const out=[];const t=dayNum(ymd());
  S.loans.forEach(l=>{
    if(l.slain||!l.track||!(l.apr>0)){l.lastAccrual=ymd();return}
    const d=t-dayNum(l.lastAccrual);
    if(d>0){
      const add=r2(l.balance*l.apr/100/365*d);
      l.balance=r2(l.balance+add);l.interest=r2((l.interest||0)+add);l.lastAccrual=ymd();
      if(add>0)out.push(add);
    }
  });
  if(out.length)save();
  return out;
}

/* ---------- projections ---------- */
function sim(B,apr,P){
  const r=apr/1200;let bal=B,m=0,ti=0;
  if(B<=0)return{m:0,ti:0};
  if(P<=0||(r>0&&P<=bal*r+0.005))return{inf:true};
  while(bal>0.005&&m<1200){const i=bal*r;ti+=i;bal+=i;bal-=Math.min(P,bal);m++}
  return m>=1200?{inf:true}:{m,ti:r2(ti)};
}

/* ---------- stats, streak, badges ---------- */
function streak(){
  if(!S.payments.length)return 0;
  const set=new Set(S.payments.map(p=>p.date.slice(0,7)));
  const d=new Date();d.setDate(1);let k=mk(d);
  if(!set.has(k)){d.setMonth(d.getMonth()-1);k=mk(d)}
  let n=0;while(set.has(k)){n++;d.setMonth(d.getMonth()-1);k=mk(d)}
  return n;
}
function stats(){
  const pays=S.payments;
  const base=sum(S.loans,l=>l.original+(l.interest||0));
  const bal=sum(S.loans,l=>l.slain?0:l.balance);
  return{
    totalPaid:r2(sum(pays,p=>p.amt)),count:pays.length,
    max:pays.reduce((m,p)=>Math.max(m,p.amt),0),
    streak:streak(),crit:pays.filter(p=>p.crit).length,
    prog:base>0?Math.max(0,Math.min(1,1-bal/base)):0,
    slain:S.loans.filter(l=>l.slain).length,
    free:S.loans.length>0&&S.loans.every(l=>l.slain),
    bal,base
  };
}
const BADGES=[
 {id:'first',e:'🗡️',n:'First blood',d:'Make your first payment',t:s=>s.count>=1},
 {id:'crit',e:'💥',n:'Critical hit',d:'Pay more than the monthly minimum',t:s=>s.crit>=1},
 {id:'h100',e:'🔨',n:'Heavy hitter',d:'One payment of $100 or more',t:s=>s.max>=100},
 {id:'h500',e:'☄️',n:'Meteor strike',d:'One payment of $500 or more',t:s=>s.max>=500},
 {id:'h1k',e:'☢️',n:'Nuclear option',d:'One payment of $1,000 or more',t:s=>s.max>=1000},
 {id:'s3',e:'🔥',n:'On fire',d:'Pay 3 months in a row',t:s=>s.streak>=3},
 {id:'s6',e:'🌋',n:'Unstoppable',d:'Pay 6 months in a row',t:s=>s.streak>=6},
 {id:'s12',e:'👑',n:'Year of power',d:'Pay 12 months in a row',t:s=>s.streak>=12},
 {id:'c10',e:'⛏️',n:'Grinder',d:'Make 10 payments',t:s=>s.count>=10},
 {id:'c25',e:'🤖',n:'Payment machine',d:'Make 25 payments',t:s=>s.count>=25},
 {id:'p10',e:'🥉',n:'10% down',d:'Wipe out 10% of your debt',t:s=>s.prog>=.10},
 {id:'p25',e:'🥈',n:'Quarter down',d:'Wipe out 25% of your debt',t:s=>s.prog>=.25},
 {id:'p50',e:'🥇',n:'Halfway hero',d:'Wipe out 50% of your debt',t:s=>s.prog>=.50},
 {id:'p75',e:'💎',n:'Final stretch',d:'Wipe out 75% of your debt',t:s=>s.prog>=.75},
 {id:'p90',e:'🚀',n:'Almost free',d:'Wipe out 90% of your debt',t:s=>s.prog>=.90},
 {id:'t1k',e:'💵',n:'$1K club',d:'Pay $1,000 total',t:s=>s.totalPaid>=1000},
 {id:'t5k',e:'💰',n:'$5K club',d:'Pay $5,000 total',t:s=>s.totalPaid>=5000},
 {id:'t10k',e:'🏦',n:'$10K club',d:'Pay $10,000 total',t:s=>s.totalPaid>=10000},
 {id:'t25k',e:'🤑',n:'$25K club',d:'Pay $25,000 total',t:s=>s.totalPaid>=25000},
 {id:'slay',e:'🏆',n:'Boss slayer',d:'Defeat a loan completely',t:s=>s.slain>=1},
 {id:'free',e:'🎉',n:'Debt-free legend',d:'Defeat every loan',t:s=>s.free}
];

/* ---------- sound ---------- */
let AC=null;
function actx(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,t0,d,type='square',v=.1,slide){
  const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03);
}
const SND={
  tap(){tone(660,0,.05,'square',.04)},
  hit(){tone(220,0,.2,'sawtooth',.16,45);tone(110,0,.22,'square',.1,40)},

  level(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*.09,.2,'triangle',.15))},
  badge(){tone(784,0,.1,'triangle',.14);tone(1175,.1,.35,'triangle',.14)},

};
const snd=n=>{if(S&&S.sound!==false){try{SND[n]()}catch(e){}}};

/* ---------- confetti ---------- */
const cv=$('#fx'),cx=cv.getContext('2d');let PS=[],raf=0;
const COLORS=['#ffc933','#ff5a7a','#3df0b0','#58c8ff','#a266ff','#ff8a3d','#ffffff'];
function sizeFx(){const d=window.devicePixelRatio||1;cv.width=innerWidth*d;cv.height=innerHeight*d;cx.setTransform(d,0,0,d,0,0)}
sizeFx();addEventListener('resize',sizeFx);
function burst(n,o={}){
  const x=o.x==null?innerWidth/2:o.x,y=o.y==null?innerHeight*.4:o.y,sp=o.spread||1;
  for(let i=0;i<n;i++)PS.push({x,y,vx:(Math.random()-.5)*14*sp,vy:-Math.random()*14*sp-3,g:.38,r:Math.random()*5+4,c:COLORS[i%COLORS.length],a:Math.random()*6,va:(Math.random()-.5)*.4,life:80+Math.random()*50,e:o.emoji&&Math.random()<.45?o.emoji:null});
  if(!raf)raf=requestAnimationFrame(loop);
}
function loop(){
  cx.clearRect(0,0,innerWidth,innerHeight);
  PS=PS.filter(p=>p.life>0&&p.y<innerHeight+40);
  PS.forEach(p=>{
    p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;p.a+=p.va;p.life--;
    cx.globalAlpha=Math.min(1,p.life/25);cx.save();cx.translate(p.x,p.y);cx.rotate(p.a);
    if(p.e){cx.font='24px serif';cx.textAlign='center';cx.textBaseline='middle';cx.fillText(p.e,0,0)}
    else{cx.fillStyle=p.c;cx.fillRect(-p.r,-p.r/2,p.r*2,p.r)}
    cx.restore();
  });
  cx.globalAlpha=1;
  if(PS.length)raf=requestAnimationFrame(loop);else{raf=0;cx.clearRect(0,0,innerWidth,innerHeight)}
}

/* ---------- payment engine ---------- */
function pay(l,amt,date){
  const hpB=hp(l),L0=lvl(S.xp);
  amt=Math.min(r2(amt),l.balance);
  l.balance=r2(l.balance-amt);l.paid=r2((l.paid||0)+amt);
  const slain=l.balance<=0.004;
  if(slain){l.balance=0;l.slain=true;l.slainDate=date}
  const min=l.minPay||0,extra=min>0?r2(Math.max(0,amt-min)):0;
  const onTime=slain||min===0||amt>=min-0.005;
  const p={id:uid(),loanId:l.id,amt,date,crit:extra>=1,extra,xp:0};
  S.payments.push(p);
  const st=streak(),mult=1+Math.min(st,12)*0.1;
  const base=Math.round(amt)+(onTime?50:20)+(p.crit?Math.round(extra):0)+(slain?500:0);
  p.xp=Math.round(base*mult);S.xp+=p.xp;
  const L1=lvl(S.xp),s=stats(),nb=[];
  BADGES.forEach(b=>{if(!S.badges[b.id]&&b.t(s)){S.badges[b.id]=ymd();nb.push(b)}});
  const hpA=hp(l);
  const ph=slain?null:[.1,.25,.5,.75].find(t=>hpB>t&&hpA<=t);
  save();
  return{p,slain,crit:p.crit,extra,streak:st,mult,lvlUp:L1>L0?L1:0,badges:nb,phase:ph,hpB,hpA,allFree:S.loans.every(x=>x.slain)};
}
function undoPay(id){
  const p=S.payments.find(x=>x.id===id);if(!p)return;
  const l=S.loans.find(x=>x.id===p.loanId);
  if(l){l.balance=r2(l.balance+p.amt);l.paid=r2(Math.max(0,(l.paid||0)-p.amt));if(l.slain){l.slain=false;l.slainDate=null;l.lastAccrual=ymd()}}
  S.xp=Math.max(0,S.xp-p.xp);
  S.payments=S.payments.filter(x=>x.id!==id);save();
}

function afterHit(res,l){

    boss.classList.remove('shake');void boss.offsetWidth;boss.classList.add('shake');

  }

  burst(Math.min(150,25+Math.round(amt/8)),{x,y,emoji:'🪙',spread:res.crit?1.4:1});

/* ---------- team play (Supabase) ---------- */
let syncT=0;
const okq=async p=>{const r=await p;if(r.error)throw r.error;return r.data};
function errMsg(e){
  const m=(e&&e.message)||String(e||'');
  if(/invalid schema|schema.*exposed/i.test(m))return 'The debt_slayer schema is not exposed yet. In Supabase open Project Settings > API > Exposed schemas and add debt_slayer.';
  if(/does not exist|could not find the (table|function)|schema cache/i.test(m))return 'The database tables are missing. Run supabase_schema.sql in the Supabase SQL Editor.';
  if(/anonymous sign-?ins? (are|is) disabled/i.test(m))return 'Turn on "Allow anonymous sign-ins" in Supabase: Authentication > Sign In / Providers.';

async function syncNow(strict){
  if(!sb||!TM.user||!S||TM.syncBlocked)return;

      const r=(pl&&pl.new)||{};if(!TM.user||r.user_id===TM.user.id)return;

  if(!TM.loaded)return (err||'<div class="card"><div class="empty">Loading your team...</div></div>')+blk+(err?acctHTML():'');
  if(!TM.party)return err+blk+`<div class="card"><h3>Start a team</h3><label style="margin-top:0">Team name</label><input type="text" id="t-pname" maxlength="40" placeholder="Team Debt Slayers"><button class="btn gold" data-act="mkparty">Create team</button></div><div class="card"><h3>Join a team</h3><label style="margin-top:0">Invite code</label><input type="text" id="t-code" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="Code from your teammate"><button class="btn" data-act="joinparty">Join team</button></div>`+acctHTML();
  return err+blk+partyHTML()+acctHTML()+`<div class="card"><button class="btn danger" style="margin-top:0" data-act="leaveparty">Leave team</button></div>`;
}
const cleanUser=v=>String(v||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
async function doAuth(kind){
  const un=cleanUser($('#t-user').value),pin=(($('#t-pin').value)||'').trim();
  if(un.length<3){toast('Username needs 3+ letters or numbers');return}
  if(!/^\d{4,6}$/.test(pin)){toast('The PIN is 4 to 6 digits');return}
  try{
    if(kind==='signin'){
      const r=await okq(sb.rpc('sign_in',{p_username:un,p_pin:pin}));
      if(!r.ok){toast(r.reason==='locked'?'Too many wrong tries. Try again in '+r.minutes+' min.':'Wrong username or PIN',4500);return}
      await setPlayer(r);toast('Welcome back, '+r.username);
    }else{
      const code=(($('#t-inv').value)||'').trim();
      if(code){
        const team=await okq(sb.rpc('check_invite',{p_code:code}));
        if(!team){toast('That code is not valid, or the team is full',4500);return}
      }
      const r=await okq(sb.rpc('register',{p_username:un,p_pin:pin,p_invite:code||null}));
      inviteCode='';await setPlayer(r);toast(code?'Welcome to the team!':'Account created. Your code is in the Team tab.',4000);snd('level');burst(80);
    }
  }catch(e){toast(errMsg(e),4500)}
}
async function mkParty(){
  try{
    await okq(sb.rpc('create_party',{p_name:(($('#t-pname').value)||'').trim()||'Our team'}));
    toast('Team created');await teamLoad(false);
  }catch(e){toast(errMsg(e),4000)}
}
async function joinParty(){
  const c=(($('#t-code').value)||'').trim();
  if(!c){toast('Enter the invite code');return}
  try{await okq(sb.rpc('join_party',{p_code:c}));toast('You joined the team!');snd('level');burst(80);await teamLoad(true)}
  catch(e){toast(errMsg(e),4000)}
}
async function leaveParty(){
  if(!confirm('Leave this team? Your teammates will no longer see your progress.'))return;
  try{await okq(sb.rpc('leave_party'));toast('You left the team');await teamLoad(false)}
  catch(e){toast(errMsg(e),4000)}
}
function copyLink(){
  const c=TM.party&&TM.party.join_code;if(!c)return;
  const u=location.origin+location.pathname+'?invite='+encodeURIComponent(c);
  try{navigator.clipboard.writeText(u).then(()=>toast('Invite link copied'),()=>toast(u,6000))}catch(e){toast(u,6000)}
}
function copyCode(){
  const c=TM.party&&TM.party.join_code;if(!c)return;
  try{navigator.clipboard.writeText(c).then(()=>toast('Code copied'),()=>toast('Code: '+c,5000))}catch(e){toast('Code: '+c,5000)}
}
async function teamSignOut(){
  try{await okq(sb.rpc('sign_out'))}catch(e){toast(errMsg(e));return}
  unsub();
  Object.assign(TM,{user:null,party:null,heroes:[],bosses:[],badges:[],feed:[],grave:[],loaded:false,err:'',syncBlocked:false});
  authMode='in';toast('Signed out on this phone');render();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  actx();
  const q=e.target.closest('[data-q]');
  if(q){
    const l=cur(),inp=$('#amt');if(!inp)return;let v=num(inp.value);const k=q.dataset.q;
    if(k==='min')v=l.minPay;else if(k==='all')v=l.balance;else if(k==='clr')v=0;else v+=Number(k);
    inp.value=v>0?String(r2(v)):'';snd('tap');updPrev(l);return;
  }
  const t=e.target.closest('[data-act]');if(!t)return;
  const a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'av':formAv=t.dataset.e;document.querySelectorAll('#avpick .pk').forEach(b=>b.classList.toggle('sel',b===t));break;
    case 'boss':formBoss=t.dataset.e;document.querySelectorAll('#bosspick .pk').forEach(b=>b.classList.toggle('sel',b===t));break;
    case 'start':{
      const name=($('#w-name').value||'').trim();
      const f=readLoan();
      if(!name){toast('Give your hero a name');return}
      if(!(f.bal>0)){toast('Enter your loan balance');return}
      const l={id:uid(),name:f.name,emoji:formBoss,original:Math.max(f.orig,f.bal),balance:f.bal,apr:f.apr,minPay:f.min,track:f.track,lastAccrual:ymd(),paid:0,interest:0,slain:false,slainDate:null};
      S={v:1,name,avatar:formAv,xp:0,badges:{},payments:[],loans:[l],sel:l.id,sound:true};
      save();tab='battle';render();snd('level');burst(90);toast('Your quest begins!');if(sb&&TM.user)setTimeout(()=>teamLoad(true),50);break;
    }
    case 'tab':tab=t.dataset.t;snd('tap');render();window.scrollTo({top:0});if(tab==='team'&&sb&&TM.user)teamLoad(false);break;
    case 'sel':S.sel=id;save();render();break;
    case 'signin':case 'signup':doAuth(a);break;
    case 'signout':teamSignOut();break;
    case 'mkparty':mkParty();break;
    case 'joinparty':joinParty();break;
    case 'leaveparty':leaveParty();break;
    case 'copycode':copyCode();break;
    case 'copylink':copyLink();break;
    case 'setmode':authMode=t.dataset.m;render();break;
    case 'redeem':doRedeem($('#t-code').value);break;
    case 'redeemold':doRedeem($('#o-code').value);break;
    case 'movephone':movePhone();break;
    case 'pinsheet':pinSheet(false);break;
    case 'savepin':savePin();break;
    case 'resetfor':resetFor(id,t.dataset.nm);break;
    case 'qrinvite':inviteQR();break;
    case 'oldphone':oldPhoneSheet();break;
    case 'closesheet':closeSheet();break;
    case 'syncanyway':
      if(confirm('Replace your account progress with this phone\'s game?')){S.playerId=TM.user.id;TM.syncBlocked=false;save();teamLoad(true)}
      break;
    case 'teamrefresh':teamLoad(false);toast('Refreshing...',1200);break;
    case 'attack':attackSheet(S.loans.find(l=>l.id===id));break;
    case 'doHit':doHit(S.loans.find(l=>l.id===id));break;
    case 'celebnext':snd('tap');nextCeleb();break;
    case 'editloan':sheetLoan(S.loans.find(l=>l.id===id));break;
    case 'addloan':formBoss=BOSSES[S.loans.length%BOSSES.length];sheetLoan(null);break;
    case 'saveloan':saveLoan(id);break;
    case 'delloan':
      if(confirm('Delete this loan and all of its payment history?')){
        S.payments=S.payments.filter(p=>p.loanId!==id);S.loans=S.loans.filter(l=>l.id!==id);
        if(!S.loans.length){wipeShared();localStorage.removeItem(KEY);S=null;closeSheet();render();break}
        S.sel=S.loans[0].id;save();closeSheet();render();
      }break;
    case 'undo':if(confirm('Undo this payment? The boss heals and the XP comes off.')){undoPay(id);render()}break;
    case 'snd':S.sound=S.sound===false;save();if(S.sound)snd('coin');render();break;
    case 'setav':S.avatar=t.dataset.e;save();render();break;
    case 'pq':planExtra=Number(t.dataset.v);{const r=$('#prange');if(r)r.value=planExtra}updPlan();break;
    case 'backup':backupSheet();break;
    case 'copybk':{
      const ta=$('#bk');ta.select();
      try{navigator.clipboard.writeText(ta.value).then(()=>toast('Backup copied'),()=>{document.execCommand('copy');toast('Backup copied')})}
      catch(err){try{document.execCommand('copy');toast('Backup copied')}catch(e2){toast('Select the text and copy it')}}
      break;
    }
    case 'restore':doRestore();break;
    case 'reset':
      if(confirm('Erase ALL progress on this phone? This cannot be undone.')&&confirm('Really erase everything?')){
        wipeShared();localStorage.removeItem(KEY);S=null;tab='battle';render();
      }break;
  }
});
function updPlan(){
  const p=$('#pex');if(p)p.textContent='+'+money0(planExtra);
  const r=$('#pres');if(r)r.innerHTML=planRes();
}
document.addEventListener('input',e=>{
  if(e.target.id==='amt'){const l=cur();updPrev(l)}
  if(e.target.id==='prange'){planExtra=Number(e.target.value);updPlan()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='s-name'&&S){S.name=e.target.value.trim()||S.name;save();render()}
  if(e.target.id==='t-share'&&S){
    S.share=e.target.checked;save();
    if(sb&&TM.user)(async()=>{try{if(!S.share)await okq(sb.rpc('hide_my_amounts'));await syncNow(true);teamLoad(false)}catch(err){toast(errMsg(err))}})();
  }
});
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden&&S){const r=accrue();if(r.length&&!$('#sheet').classList.contains('on'))render();if(sb&&TM.user)teamLoad(false)}
});

/* ---------- boot ---------- */
if(S){
  S.badges=S.badges||{};S.payments=S.payments||[];S.xp=S.xp||0;
  const r=accrue();render();
  const t=r2(sum(r));if(t>=0.01)setTimeout(()=>toast('😈 Interest healed your bosses by '+money(t)),600);
}else render();
initSB();
try{
  const iv=new URLSearchParams(location.search).get('invite');
  if(iv){inviteCode=iv.trim().toUpperCase();authMode='up';tab='team';if(S)render();else toast('Create your hero first, then open the Team tab to join.',6000)}
}catch(e){}
})();
</script>
</body>
</html>
